name: ci

# Manual trigger only: GitHub-hosted runners are unavailable on this account, and automatic runs
# would mark every commit as failed. Checks run locally via `python scripts/check.py` and the
# pre-commit hook. Restore the push / pull_request triggers when hosted runners are available.
on:
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint, format, tests (golden fixtures, quality gates, end-to-end, reproducibility)
        run: python scripts/check.py
      - name: Committed data and outputs are reproducible
        run: |
          python scripts/generate_data.py
          python -m retailmetrics.pipeline
          git diff --exit-code -- data outputs
